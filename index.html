<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>সেবা বাজার</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  
  <!-- 🔥 Firebase SDKs (সঠিকভাবে লোড হচ্ছে) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    /* আপনার পুরানো CSS এখানে থাকবে */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    /* ... বাকি CSS আগের মতোই থাকবে ... */
    /* (স্থান বাঁচাতে CSS বাদ দিচ্ছি, কিন্তু আপনার ফুল কোডে থাকবে) */
  </style>
</head>
<body>

<!-- আপনার পুরানো HTML এখানে থাকবে -->
<!-- (স্থান বাঁচাতে HTML বাদ দিচ্ছি, কিন্তু আপনার ফুল কোডে থাকবে) -->

<script>
  // ============================================================
  //  🔥 FIREBASE CONFIG (সঠিক ডেটা)
  // ============================================================
  
  const firebaseConfig = {
    apiKey: "AIzaSyCiYlceOG4X1Zw1IdDy2xz3fIWuydYof3A",
    authDomain: "mistri-book.firebaseapp.com",
    projectId: "mistri-book",
    storageBucket: "mistri-book.firebasestorage.app",
    messagingSenderId: "387524929495",
    appId: "1:387524929495:web:e643a4f968306f259bcd92"
  };

  // ============================================================
  //  🔥 FIREBASE INIT (এখানে সমস্যা ছিল)
  // ============================================================
  
  // Firebase চেক করা
  if (typeof firebase !== 'undefined') {
    console.log('✅ Firebase loaded successfully!');
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Firestore settings
    db.settings({ merge: true });
    
    console.log('✅ Firebase initialized!');
    console.log('✅ Auth:', auth);
    console.log('✅ Firestore:', db);
    
    // ============================================================
    //  গ্লোবাল স্টেট
    // ============================================================
    
    let currentUserRole = null;
    let isLoggedIn = false;
    let currentUserId = null;
    let userMap = null;
    let providerMap = null;
    let mapMarkers = [];
    let currentProviders = [];
    let currentCategory = 'প্লাম্বার';
    let currentFilter = 'all';
    let userLat = 23.735;
    let userLng = 90.380;
    let providerLat = 23.735;
    let providerLng = 90.380;

    // ============================================================
    //  টোস্ট মেসেজ
    // ============================================================
    
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // ============================================================
    //  পেজ নেভিগেশন
    // ============================================================
    
    function goToPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(pageId);
      if (target) target.classList.add('active');
      document.getElementById('app-content').scrollTop = 0;
      updateNav(pageId);
    }

    function navigateTo(pageId) {
      if (isLoggedIn && currentUserRole === 'user') {
        goToPage(pageId);
      } else if (!isLoggedIn) {
        showToast('⚠️ দয়া করে লগইন করুন!', 'error');
      }
    }

    function navigateToProvider(pageId) {
      if (isLoggedIn && currentUserRole === 'provider') {
        goToPage(pageId);
      } else if (!isLoggedIn) {
        showToast('⚠️ দয়া করে লগইন করুন!', 'error');
      }
    }

    function updateNav(activePageId) {
      document.querySelectorAll('#bottom-nav-user .nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === activePageId);
      });
      document.querySelectorAll('#bottom-nav-provider .nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === activePageId);
      });
    }

    // ============================================================
    //  রোল সিলেকশন (এখন কাজ করবে!)
    // ============================================================
    
    window.selectRole = function(role) {
      console.log('✅ Role Selected:', role);
      currentUserRole = role;
      if (role === 'user') {
        goToPage('page-user-form');
      } else {
        goToPage('page-provider-form');
      }
    };

    // ============================================================
    //  ইউজার রেজিস্ট্রেশন
    // ============================================================
    
    window.showUserLogin = function() {
      goToPage('page-user-login');
    };

    window.showUserRegister = function() {
      goToPage('page-user-form');
    };

    window.registerUser = async function() {
      const name = document.getElementById('user-name').value.trim();
      const location = document.getElementById('user-location').value.trim();
      const phone = document.getElementById('user-phone').value.trim();

      if (!name || !location || !phone) {
        showToast('⚠️ দয়া করে সব তথ্য দিন!', 'error');
        return;
      }

      const cleaned = phone.replace(/\D/g, '');
      if (cleaned.length < 11 || cleaned.length > 14) {
        showToast('❌ সঠিক মোবাইল নম্বর দিন (০১XXXXXXXXX)', 'error');
        return;
      }

      try {
        const credential = firebase.auth.PhoneAuthProvider.credential(
          `+88${cleaned}`, 
          '123456'
        );
        
        const userCredential = await auth.signInWithCredential(credential);
        const uid = userCredential.user.uid;

        await db.collection('users').doc(uid).set({
          uid: uid,
          name: name,
          location: location,
          phone: phone,
          wallet: 0,
          role: 'user',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        currentUserId = uid;
        currentUserRole = 'user';
        isLoggedIn = true;

        showToast('✅ রেজিস্ট্রেশন সফল!', 'success');
        
        document.getElementById('bottom-nav-user').classList.add('show');
        document.getElementById('bottom-nav-provider').classList.remove('show');
        
        await loadUserData(uid);
        goToPage('page-user-home');
        updateNav('page-user-home');

      } catch (error) {
        console.error('রেজিস্ট্রেশন ত্রুটি:', error);
        showToast('❌ রেজিস্ট্রেশন ব্যর্থ: ' + error.message, 'error');
      }
    };

    // ============================================================
    //  ইউজার লগইন
    // ============================================================
    
    window.loginUser = async function() {
      const phone = document.getElementById('user-login-phone').value.trim();
      const cleaned = phone.replace(/\D/g, '');

      if (cleaned.length < 11 || cleaned.length > 14) {
        showToast('❌ সঠিক মোবাইল নম্বর দিন', 'error');
        return;
      }

      try {
        const credential = firebase.auth.PhoneAuthProvider.credential(
          `+88${cleaned}`,
          '123456'
        );
        
        const userCredential = await auth.signInWithCredential(credential);
        const uid = userCredential.user.uid;

        const doc = await db.collection('users').doc(uid).get();
        
        if (!doc.exists) {
          showToast('❌ এই নম্বরে কোনো অ্যাকাউন্ট নেই!', 'error');
          await auth.signOut();
          return;
        }

        const userData = doc.data();
        if (userData.role !== 'user') {
          showToast('❌ এই অ্যাকাউন্ট প্রোভাইডার হিসেবে নিবন্ধিত!', 'error');
          await auth.signOut();
          return;
        }

        currentUserId = uid;
        currentUserRole = 'user';
        isLoggedIn = true;

        showToast('✅ লগইন সফল!', 'success');
        
        document.getElementById('bottom-nav-user').classList.add('show');
        document.getElementById('bottom-nav-provider').classList.remove('show');
        
        await loadUserData(uid);
        goToPage('page-user-home');
        updateNav('page-user-home');

      } catch (error) {
        console.error('লগইন ত্রুটি:', error);
        showToast('❌ লগইন ব্যর্থ: ' + error.message, 'error');
      }
    };

    // ============================================================
    //  প্রোভাইডার রেজিস্ট্রেশন
    // ============================================================
    
    window.showProviderLogin = function() {
      goToPage('page-provider-login');
    };

    window.showProviderRegister = function() {
      goToPage('page-provider-form');
    };

    window.registerProvider = async function() {
      const name = document.getElementById('provider-name').value.trim();
      const work = document.getElementById('provider-work').value.trim();
      const experience = parseInt(document.getElementById('provider-experience').value);
      const nid = document.getElementById('provider-nid').value.trim();
      const phone = document.getElementById('provider-phone').value.trim();

      if (!name || !work || !experience || !nid || !phone) {
        showToast('⚠️ দয়া করে সব তথ্য দিন!', 'error');
        return;
      }

      const cleaned = phone.replace(/\D/g, '');
      if (cleaned.length < 11 || cleaned.length > 14) {
        showToast('❌ সঠিক মোবাইল নম্বর দিন', 'error');
        return;
      }

      try {
        const credential = firebase.auth.PhoneAuthProvider.credential(
          `+88${cleaned}`,
          '123456'
        );
        
        const userCredential = await auth.signInWithCredential(credential);
        const uid = userCredential.user.uid;

        await db.collection('providers').doc(uid).set({
          uid: uid,
          name: name,
          work: work,
          experience: experience,
          nid: nid,
          phone: phone,
          wallet: 0,
          role: 'provider',
          status: 'pending',
          rating: 0,
          totalOrders: 0,
          location: 'ঢাকা, মিরপুর',
          lat: 23.735,
          lng: 90.380,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        await db.collection('users').doc(uid).set({
          uid: uid,
          name: name,
          phone: phone,
          role: 'provider',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        currentUserId = uid;
        currentUserRole = 'provider';
        isLoggedIn = true;

        showToast('✅ প্রোভাইডার রেজিস্ট্রেশন সফল! অ্যাডমিন অনুমোদনের অপেক্ষায়', 'success');
        
        document.getElementById('bottom-nav-provider').classList.add('show');
        document.getElementById('bottom-nav-user').classList.remove('show');
        
        await loadProviderData(uid);
        goToPage('page-provider-home');
        updateNav('page-provider-home');
        
        setTimeout(() => initProviderMap(23.735, 90.380), 500);

      } catch (error) {
        console.error('প্রোভাইডার রেজিস্ট্রেশন ত্রুটি:', error);
        showToast('❌ রেজিস্ট্রেশন ব্যর্থ: ' + error.message, 'error');
      }
    };

    // ============================================================
    //  প্রোভাইডার লগইন
    // ============================================================
    
    window.loginProvider = async function() {
      const phone = document.getElementById('provider-login-phone').value.trim();
      const cleaned = phone.replace(/\D/g, '');

      if (cleaned.length < 11 || cleaned.length > 14) {
        showToast('❌ সঠিক মোবাইল নম্বর দিন', 'error');
        return;
      }

      try {
        const credential = firebase.auth.PhoneAuthProvider.credential(
          `+88${cleaned}`,
          '123456'
        );
        
        const userCredential = await auth.signInWithCredential(credential);
        const uid = userCredential.user.uid;

        const doc = await db.collection('providers').doc(uid).get();
        
        if (!doc.exists) {
          showToast('❌ এই নম্বরে কোনো প্রোভাইডার অ্যাকাউন্ট নেই!', 'error');
          await auth.signOut();
          return;
        }

        const providerData = doc.data();
        
        if (providerData.status === 'pending') {
          showToast('⏳ আপনার অ্যাকাউন্ট অনুমোদনের অপেক্ষায় রয়েছে', 'warning');
          await auth.signOut();
          return;
        }

        if (providerData.status === 'rejected') {
          showToast('❌ আপনার অ্যাকাউন্ট প্রত্যাখ্যান করা হয়েছে', 'error');
          await auth.signOut();
          return;
        }

        currentUserId = uid;
        currentUserRole = 'provider';
        isLoggedIn = true;

        showToast('✅ লগইন সফল!', 'success');
        
        document.getElementById('bottom-nav-provider').classList.add('show');
        document.getElementById('bottom-nav-user').classList.remove('show');
        
        await loadProviderData(uid);
        goToPage('page-provider-home');
        updateNav('page-provider-home');
        
        setTimeout(() => initProviderMap(providerData.lat || 23.735, providerData.lng || 90.380), 500);

      } catch (error) {
        console.error('প্রোভাইডার লগইন ত্রুটি:', error);
        showToast('❌ লগইন ব্যর্থ: ' + error.message, 'error');
      }
    };

    // ============================================================
    //  ডাটা লোড ফাংশন (সহজ সংস্করণ)
    // ============================================================
    
    async function loadUserData(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('profileName').textContent = data.name || '-';
          document.getElementById('profileLocation').textContent = data.location || '-';
          document.getElementById('profilePhone').textContent = data.phone || '-';
          document.getElementById('userWalletBalance').textContent = (data.wallet || 0).toLocaleString();
          document.getElementById('walletBalanceDisplay').textContent = (data.wallet || 0).toLocaleString();
          
          if (data.location) {
            document.getElementById('userLocationInput').value = data.location;
          }
        }
      } catch (error) {
        console.error('ইউজার ডাটা লোড ত্রুটি:', error);
      }
    }

    async function loadProviderData(uid) {
      try {
        const doc = await db.collection('providers').doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('providerNameDisplay').textContent = data.name || '-';
          document.getElementById('providerProfileName').textContent = data.name || '-';
          document.getElementById('providerProfileWork').textContent = data.work || '-';
          document.getElementById('providerProfileExp').textContent = data.experience || '-';
          document.getElementById('providerProfileNid').textContent = data.nid || '-';
          document.getElementById('providerProfilePhone').textContent = data.phone || '-';
          document.getElementById('providerProfileLocation').textContent = data.location || 'ঢাকা, মিরপুর';
          document.getElementById('providerCategory').textContent = data.work || '-';
          document.getElementById('providerWalletBalance').textContent = (data.wallet || 0).toLocaleString();
          document.getElementById('providerWalletDisplay').textContent = (data.wallet || 0).toLocaleString();
          document.getElementById('providerWalletStat').textContent = (data.wallet || 0).toLocaleString();
          document.getElementById('providerTotalOrders').textContent = (data.totalOrders || 0) + 'টি';
          document.getElementById('providerProfileOrders').textContent = data.totalOrders || 0;
          
          const statusEl = document.getElementById('providerStatus');
          if (data.status === 'approved') {
            statusEl.textContent = '✅ অনুমোদিত';
            statusEl.style.color = '#2e7d32';
          } else if (data.status === 'pending') {
            statusEl.textContent = '⏳ অনুমোদনের অপেক্ষায়';
            statusEl.style.color = '#e65100';
          } else {
            statusEl.textContent = '❌ প্রত্যাখ্যান';
            statusEl.style.color = '#c62828';
          }
          
          providerLat = data.lat || 23.735;
          providerLng = data.lng || 90.380;
        }
      } catch (error) {
        console.error('প্রোভাইডার ডাটা লোড ত্রুটি:', error);
      }
    }

    // ============================================================
    //  লগআউট
    // ============================================================
    
    window.logout = async function() {
      if (confirm('আপনি কি লগআউট করতে চান?')) {
        try {
          await auth.signOut();
          isLoggedIn = false;
          currentUserRole = null;
          currentUserId = null;
          document.getElementById('bottom-nav-user').classList.remove('show');
          document.getElementById('bottom-nav-provider').classList.remove('show');
          showToast('✅ লগআউট সফল!', 'success');
          goToPage('page-role');
        } catch (error) {
          console.error('লগআউট ত্রুটি:', error);
        }
      }
    };

    // ============================================================
    //  অ্যাডমিন
    // ============================================================
    
    const ADMIN_PASSWORD = 'admin123';

    window.verifyAdmin = function() {
      const password = document.getElementById('adminPassword').value;
      if (password === ADMIN_PASSWORD) {
        goToPage('page-admin-dashboard');
        document.getElementById('adminError').textContent = '';
        loadAdminDashboard();
      } else {
        document.getElementById('adminError').textContent = '❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।';
      }
    };

    async function loadAdminDashboard() {
      try {
        const usersSnap = await db.collection('users').get();
        document.getElementById('adminTotalUsers').textContent = usersSnap.size;
      } catch (error) {
        console.error('অ্যাডমিন ড্যাশবোর্ড লোড ত্রুটি:', error);
      }
    }

    window.logoutAdmin = function() {
      document.getElementById('adminPassword').value = '';
      goToPage('page-role');
    };

    // ============================================================
    //  অনবোর্ডিং
    // ============================================================
    
    function startOnboarding() {
      document.getElementById('appNameDisplay').textContent = 'সেবা বাজার';
      document.getElementById('page-onboarding').classList.add('active');
      setTimeout(() => {
        document.getElementById('page-onboarding').classList.remove('active');
        document.getElementById('page-role').classList.add('active');
      }, 2000);
    }

    // ============================================================
    //  ইনিশিয়াল লোড
    // ============================================================
    
    window.addEventListener('load', function() {
      // Firebase Auth State চেক
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          try {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
              const data = userDoc.data();
              currentUserId = user.uid;
              
              if (data.role === 'user') {
                currentUserRole = 'user';
                isLoggedIn = true;
                document.getElementById('bottom-nav-user').classList.add('show');
                document.getElementById('bottom-nav-provider').classList.remove('show');
                await loadUserData(user.uid);
                goToPage('page-user-home');
                updateNav('page-user-home');
              } else if (data.role === 'provider') {
                const providerDoc = await db.collection('providers').doc(user.uid).get();
                if (providerDoc.exists && providerDoc.data().status === 'approved') {
                  currentUserRole = 'provider';
                  isLoggedIn = true;
                  document.getElementById('bottom-nav-provider').classList.add('show');
                  document.getElementById('bottom-nav-user').classList.remove('show');
                  await loadProviderData(user.uid);
                  goToPage('page-provider-home');
                  updateNav('page-provider-home');
                } else {
                  await auth.signOut();
                  showToast('⏳ আপনার অ্যাকাউন্ট অনুমোদনের অপেক্ষায় রয়েছে', 'warning');
                  goToPage('page-role');
                }
              }
            } else {
              await auth.signOut();
              goToPage('page-role');
            }
          } catch (error) {
            console.error('অথেন্টিকেশন চেক ত্রুটি:', error);
            goToPage('page-role');
          }
        } else {
          if (window.location.hash === '#admin') {
            document.getElementById('page-onboarding')?.classList.remove('active');
            goToPage('page-admin-login');
            return;
          }
          startOnboarding();
        }
      });

      document.getElementById('userSearchInput')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          showToast('🔍 আপনি খুঁজছেন: "' + this.value + '"', 'success');
        }
      });
    });

    window.addEventListener('hashchange', function() {
      if (window.location.hash === '#admin') {
        goToPage('page-admin-login');
